server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:example_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-underline: true

jwt:
  secret: ecommerce_admin_jwt_secret_key_2024
  expiration: 86400000

logging:
  level:
    com.example.ecommerce: DEBUG
    org.springframework.security: INFO
